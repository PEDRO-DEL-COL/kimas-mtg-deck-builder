# Kima's MTG Deck Builder - local development stack.
# NOTE: untested locally (no Docker was available when this file was written).
# Production target is Supabase (hosted Postgres); the `db` service below is
# for local-only use.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kimas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-kimas}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-kimas} -d $${POSTGRES_DB:-kimas}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Overrides DATABASE_URL from .env so the API talks to the local db service.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-kimas}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-kimas}
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api

  worker:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-kimas}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-kimas}
    # TODO: APScheduler worker for Scryfall/LigaMagic jobs. Placeholder that idles.
    command: sleep infinity
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
